[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offroad-autonomy"
version = "0.1.0"
description = "End-to-end autonomous off-road driving pipeline for BeamNG.tech"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "beamngpy>=1.29",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "torch>=2.1",
    "ultralytics>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
offroad-autonomy = "offroad_autonomy.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
