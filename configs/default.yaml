perception:
  model_weights: "models/yoloe-26x-seg.pt"
  confidence_threshold: 0.25
  input_size: 640
  prompts:
    - "traversable road"
    - "dirt road"
    - "off-road trail"
    - "drivable terrain"
    - "gravel path"

preprocessing:
  target_width: 640
  target_height: 360
  enable_clahe: true
  clahe_clip_limit: 2.0
  clahe_grid_size: 8

postprocessing:
  ema_alpha: 0.7
  min_mask_area_fraction: 0.001
  morphology_kernel_size: 5

planning:
  centerline_samples: 20
  kalman_process_noise: 1.0e-3
  kalman_measurement_noise: 1.0e-1
  fallback_after_n_misses: 3
  min_road_pixels: 500

control:
  stanley_gain_k: 2.5
  stanley_softening: 1.0
  target_speed_mps: 5.0
  max_throttle: 0.6
  max_brake: 0.8
  speed_kp: 0.3
