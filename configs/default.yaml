perception:
  model_weights: "C:\\Users\\chrrr\\Downloads\\Carla\\orfd-lane-detection\\models\\yoloe-26x-seg.pt"
  confidence_threshold: 0.25
  input_size: 640
  prompts:
    - "traversable road"
    - "dirt road"
    - "off-road trail"
    - "drivable terrain"
    - "gravel path"

preprocessing:
  target_width: 640
  target_height: 360
  enable_clahe: true
  clahe_clip_limit: 2.0
  clahe_grid_size: 8

postprocessing:
  ema_alpha: 0.7
  min_mask_area_fraction: 0.001
  morphology_kernel_size: 5

planning:
  centerline_samples: 20
  backend: heuristic
  horizon_fraction: 0.82
  smoothing_window: 7
  clearance_weight: 0.65
  prior_std_fraction: 0.14
  min_confidence: 0.18
  segment_center_weight: 0.68
  temporal_blend: 0.65
  max_lateral_step_px: 32.0
  straight_blend: 0.72
  straight_residual_px: 4.0
  straight_heading_threshold: 0.08
  kalman_process_noise: 5.0e-4
  kalman_measurement_noise: 1.0e-1
  fallback_after_n_misses: 3
  min_road_pixels: 500

control:
  stanley_gain_k: 1.15
  stanley_softening: 2.4
  stanley_heading_gain: 0.75
  stanley_lookahead_fraction: 0.35
  stanley_near_path_weight: 0.35
  steering_ema_alpha: 0.28
  max_steering_delta: 0.10
  steering_deadband: 0.03
  target_speed_mph: 12.0
  speed_limit_mph: 15.0
  min_turn_speed_mph: 7.0
  curve_speed_gain: 475.0
  heading_speed_gain: 1.1
  max_throttle: 0.45
  max_brake: 0.8
  speed_kp: 0.22

visualization:
  dashboard:
    colors:
      BG: [18, 22, 26]
      PANEL_BG: [28, 33, 38]
      CARD_BG: [34, 40, 46]
      CARD_BORDER: [54, 62, 70]
      TEXT_PRIMARY: [238, 240, 242]
      TEXT_SECONDARY: [155, 163, 172]
      MUTED_LINE: [72, 80, 88]
      MASK_FILL: [100, 172, 116]
      MASK_EDGE: [182, 224, 193]
      PATH_GLOW: [92, 184, 255]
      PATH_CORE: [72, 174, 255]
      PATH_HIGHLIGHT: [246, 249, 252]
      GOOD: [102, 187, 106]
      WARN: [82, 181, 233]
      BAD: [90, 92, 225]
