ui:
  # No window and no display camera: for containers and machines without a
  # screen. --headless on the command line does the same.
  headless: false
  # With display_async the dashboard is on its own thread and skipping buys
  # nothing; this only matters when display_async is false.
  render_every_n: 1
  # Keeps rendering and GUI time out of the autonomy loop, so "Autonomy FPS"
  # measures the vehicle rather than the window. false is for debugging only.
  display_async: true
  # The autonomy loop is not synchronised to this; lowering it frees GPU/CPU
  # for perception and nothing else.
  display_rate_hz: 20.0
  # Keys 0-9 switch at runtime:
  #   0 default  1 raw  2 rectified  3 disparity  4 depth  5 stitched
  #   6 mask  7 fused  8 roi  9 pipeline     T toggles the timing overlay
  debug_view: default
  timing_overlay: false
  log_interval_s: 5.0
