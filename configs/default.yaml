perception:
  model_weights: "models/yoloe-26x-seg.pt"
  confidence_threshold: 0.25
  input_size: 640
  prompts:
    - "traversable road"
    - "dirt road"
    - "off-road trail"
    - "drivable terrain"
    - "gravel path"

preprocessing:
  target_width: 640
  target_height: 360
  enable_clahe: true
  clahe_clip_limit: 2.0
  clahe_grid_size: 8

postprocessing:
  ema_alpha: 0.4
  min_mask_area_fraction: 0.001
  morphology_kernel_size: 5

planning:
  centerline_samples: 20
  kalman_process_noise: 1.0e-3
  kalman_measurement_noise: 1.0e-1
  fallback_after_n_misses: 3
  min_road_pixels: 500

control:
  stanley_gain_k: 2.5
  stanley_softening: 1.0
  steer_kp: 3.0
  steer_ki: 0.1
  steer_kd: 0.0
  target_speed_mps: 5.0
  max_throttle: 0.6
  max_brake: 0.8
  speed_kp: 0.3

visualization:
  dashboard:
    colors:
      BG: [18, 22, 26]
      PANEL_BG: [28, 33, 38]
      CARD_BG: [34, 40, 46]
      CARD_BORDER: [54, 62, 70]
      TEXT_PRIMARY: [238, 240, 242]
      TEXT_SECONDARY: [155, 163, 172]
      MUTED_LINE: [72, 80, 88]
      MASK_FILL: [100, 172, 116]
      MASK_EDGE: [182, 224, 193]
      PATH_GLOW: [92, 184, 255]
      PATH_CORE: [72, 174, 255]
      PATH_HIGHLIGHT: [246, 249, 252]
      GOOD: [102, 187, 106]
      WARN: [82, 181, 233]
      BAD: [90, 92, 225]
